appId: com.daggerfall.saveeditor
productName: Daggerfall Unity Save Editor

directories:
  output: release/
  buildResources: build

publish:
  provider: github

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

mac:
  target:
    - dmg
  icon: build/icon.svg

linux:
  target:
    - AppImage
    - tar.gz
  icon: build/icon.svg
