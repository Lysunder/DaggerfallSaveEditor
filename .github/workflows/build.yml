name: Build and Package Editor

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and package
        run: npm run build:dist -- -p never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.dmg.blockmap
            release/latest*.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-save-editor-artifacts-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
